! Node j2: second joiner. Started only after j1 has already JOINed, so group 1
! has 2 members (r, j1) by the time j2's MEMBER_PROBE_DONE evaluates.
! Transport 10.20.3.2 | ASN 65103 | Router-ID 10.0.103.1
frr version 10.0
hostname node-gr-j2
log file logs/bgpd-j2.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65103
  bgp router-id 10.0.103.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  address-family link-state link-state
    distribute bgp-fabric-link-state
  exit-address-family

  midr transport-address 10.0.103.1
  midr group-id 0
  ! 【我方适配】原版指向 r（当时 r 兼任引导），改指专职引导 b；
  ! `router-id` 一栏是本仓库 2026-08-13（批 5a）起的必选项，不带会灌配置失败。
  midr bootstrap 10.0.100.1 remote-as 65100 router-id 10.0.100.1
!
