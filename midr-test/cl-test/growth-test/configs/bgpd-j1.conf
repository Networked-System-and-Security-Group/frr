! Node j1: first joiner. Bootstraps against r while group 1 has only 1 member.
! Transport 10.20.2.2 | ASN 65102 | Router-ID 10.0.102.1
frr version 10.0
hostname node-gr-j1
log file logs/bgpd-j1.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65102
  bgp router-id 10.0.102.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  address-family link-state link-state
    distribute bgp-fabric-link-state
  exit-address-family

  midr transport-address 10.0.102.1
  midr group-id 0
  ! 【我方适配】原版指向 r（当时 r 兼任引导），改指专职引导 b；
  ! `router-id` 一栏是本仓库 2026-08-13（批 5a）起的必选项，不带会灌配置失败。
  midr bootstrap 10.0.100.1 remote-as 65100 router-id 10.0.100.1
!
