! Node j3: third joiner. Started only after j2 has already JOINed, so group 1
! has 3 members (r, j1, j2) by the time j3's MEMBER_PROBE_DONE evaluates.
! Transport 10.20.4.2 | ASN 65104 | Router-ID 10.0.104.1
frr version 10.0
hostname node-gr-j3
log file logs/bgpd-j3.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65104
  bgp router-id 10.0.104.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  address-family link-state link-state
    distribute bgp-fabric-link-state
  exit-address-family

  midr transport-address 10.20.4.2
  midr group-id 0
  ! 【我方适配】原版指向 r（当时 r 兼任引导），改指专职引导 b；
  ! `router-id` 一栏是本仓库 2026-08-13（批 5a）起的必选项，不带会灌配置失败。
  midr bootstrap 10.20.5.2 remote-as 65100 router-id 10.0.100.1
!
