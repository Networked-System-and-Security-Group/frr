! Node b: dedicated bootstrap node.
! Transport 10.20.5.2 | ASN 65100 | Router-ID 10.0.100.1
!
! 【我方新增，原版没有这个节点】原版把引导角色兼在 r 上（`midr role bootstrap`
! 与 `midr group-id 1` / `midr role group-rep` 同时配）。本仓库 2026-08-13（保底
! 轮 2 批 5b）起两个角色**硬互斥、引导优先**：一旦带 BOOTSTRAP 位，群号与
! group-rep 命令一律被拒 —— 兼任会让群 1 根本不存在，测试必挂。故拆出专职引导。
!
! 引导只做两件事：应答 joiner 的 REP_LIST_REQ（代表目录按 GROUP_REP 能力位从
! 节点表**纯推导**，`midr rep group` 手配命令已于批 1.5 删除），以及接受群代表
! 的挂靠。它不配 group-id、不入群、也不发自己的 Node NLRI。
!
! 不写 `distribute bgp-fabric-link-state`：成为引导时代码会无条件关掉本地拓扑
! 导出（midr_nds_bootstrap_stop_distribute），写了也会被关。这里不写只是让配置与
! 实际状态一致。⚠ 只影响"本机生成自己的 NLRI"，转发他人 NLRI 不受影响。
frr version 10.0
hostname node-gr-b
log file logs/bgpd-b.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65100
  bgp router-id 10.0.100.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  ! 无静态邻居：r 靠挂靠钩子自动连上来，joiner 走 TCP 短连接问目录。

  address-family link-state link-state
  exit-address-family

  midr transport-address 10.0.100.1
  midr role bootstrap
  midr session 10.0.101.1 remote-as 65101
!
