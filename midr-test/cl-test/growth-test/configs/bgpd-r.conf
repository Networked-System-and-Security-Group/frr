! Node r: Group 1 representative + bootstrap node, no static members.
! Transport 10.20.1.2 | ASN 65101 | Router-ID 10.0.101.1
! Group 1 starts with ONLY this node — the whole point of the test is to
! grow it past a size the old flat MIDR_CL_MIN_GOOD_LINKS=5 floor could
! never reach.
frr version 10.0
hostname node-gr-r
log file logs/bgpd-r.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65101
  bgp router-id 10.0.101.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  ! No static neighbors — joiners connect dynamically via the MIDR join flow.

  address-family link-state link-state
    distribute bgp-fabric-link-state
  exit-address-family

  midr transport-address 10.20.1.2
  midr group-id 1
  midr role group-rep
  ! 【我方适配】原版这里还有 `midr role bootstrap` 与
  !   `midr rep group 1 transport 10.20.1.2 remote-as 65101`
  ! 两行，本仓库都不能要：前者与 group-rep 硬互斥（引导优先，会把 group-id /
  ! group-rep 一并拒掉）；后者的命令已于保底轮 2 批 1.5 删除（代表目录改纯推导）。
  ! 引导职责已拆给专职节点 b；r 只当群 1 代表，靠挂靠钩子自动连上 b，b 再从 r 的
  ! Node NLRI 推导出代表目录来应答 joiner。
  midr bootstrap 10.20.5.2 remote-as 65100 router-id 10.0.100.1
!
