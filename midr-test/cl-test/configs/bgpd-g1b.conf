! Node g1b: Group 1 member
! Transport 10.10.12.2 | ASN 65012 | Router-ID 10.0.12.1
frr version 10.0
hostname node-g1b
log file logs/bgpd-g1b.log debugging
log timestamp precision 3

debug bgp midr

router bgp 65012
  bgp router-id 10.0.12.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  neighbor 10.10.11.2 remote-as 65011
  neighbor 10.10.11.2 ebgp-multihop 3

  address-family link-state link-state
    distribute bgp-fabric-link-state
    neighbor 10.10.11.2 activate
  exit-address-family

  midr transport-address 10.0.12.1
  midr group-id 1
  ! 群 1 代表（批 6 改）：原代表 g1a 随批 5b 的角色硬互斥收敛成了专职引导、
  ! 退出群 1，群 1 就没代表了——目录里查不到群 1，newnode 的 RECOMMEND 阶段
  ! 也就没法选它。改由 g1b 当代表，RECOMMEND → 探成员这条链才走得完。
  ! ⚠ 连带（2026-08-18 更新）：群 1 成员从 5 台（含 g1a）变 4 台。**在 JOIN 阈值
  !   封顶落地之前**，4 台低于绝对阈值 5，本测试终局是 CREATE 而非 JOIN；封顶
  !   （min(5, 已知成员数)）合入后 4/4 即可入群，终局重新回到 JOIN 群 1。
  midr role group-rep
  ! 删探测 A 后（发现链专题 2026-08-21）：认识群友的唯一途径是 join 流程向引导
  ! 要成员表，故凡参与 MIDR 的节点都必须配引导——原先靠"见到同群 NLRI 就建连"
  ! 兜底，那条路已删。g1a 是本台子的引导。
  midr bootstrap 10.0.11.1 remote-as 65011 router-id 10.0.11.1
!
