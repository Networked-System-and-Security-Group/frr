! Node g1a: Group 1 representative + bootstrap node
! Transport 10.10.11.2 | ASN 65011 | Router-ID 10.0.11.1
frr version 10.0
hostname node-g1a
log file logs/bgpd-g1a.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65011
  bgp router-id 10.0.11.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  ! Group 1 members — exchange BGP-LS so g1a can serve their transport addrs in MEMBER_LIST
  neighbor 10.10.12.2 remote-as 65012
  neighbor 10.10.12.2 ebgp-multihop 3
  neighbor 10.10.13.2 remote-as 65013
  neighbor 10.10.13.2 ebgp-multihop 3
  neighbor 10.10.14.2 remote-as 65014
  neighbor 10.10.14.2 ebgp-multihop 3
  neighbor 10.10.15.2 remote-as 65015
  neighbor 10.10.15.2 ebgp-multihop 3
  ! Group 2 representative — cross-group BGP-LS, g1a learns g2a transport addr
  neighbor 10.10.21.2 remote-as 65021
  neighbor 10.10.21.2 ebgp-multihop 3
  ! Group 3 representative — cross-group BGP-LS, g1a learns g3a transport addr
  ! (also gives dynamic rep-candidate derivation, midr_rep_candidates(), a real
  ! GROUP_REP-bit node to find, on top of the static "midr rep group 3" below)
  neighbor 10.10.31.2 remote-as 65031
  neighbor 10.10.31.2 ebgp-multihop 3

  address-family link-state link-state
    neighbor 10.10.12.2 activate
    neighbor 10.10.13.2 activate
    neighbor 10.10.14.2 activate
    neighbor 10.10.15.2 activate
    neighbor 10.10.21.2 activate
    neighbor 10.10.31.2 activate
  exit-address-family

  midr transport-address 10.10.11.2
  midr group-id 1
  midr role group-rep
  midr role bootstrap
  ! Static rep directory served to joining nodes (all three groups)
  midr rep group 1 transport 10.10.11.2 remote-as 65011
  midr rep group 2 transport 10.10.21.2 remote-as 65021
  midr rep group 3 transport 10.10.31.2 remote-as 65031
!
