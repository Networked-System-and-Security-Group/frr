! Node newnode: New node joining the network (no initial group)
! Transport 10.10.99.2 | ASN 65099 | Router-ID 10.0.99.1
frr version 10.0
hostname newnode
log file logs/bgpd-newnode.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65099
  bgp router-id 10.0.99.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  ! No static BGP neighbors — discovers all peers via the MIDR join flow.

  address-family link-state link-state
  exit-address-family

  midr transport-address 10.10.99.2
  midr group-id 0
  ! Bootstrap: triggers the join flow immediately at startup.
  ! g1a (10.10.11.2, AS 65011) is the bootstrap/representative for both groups.
  midr bootstrap 10.10.11.2 remote-as 65011
!
