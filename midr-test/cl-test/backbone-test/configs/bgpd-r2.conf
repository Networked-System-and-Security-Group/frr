! Node r2: group 2 representative. Transport(lo) 10.99.0.121 | Router-ID
! 10.0.0.121 | ASN 65121. Attached to t2, but deliberately with a slow
! access link (25ms/20mbit) -- group 2's whole purpose in this topology is
! to be the clearly-worse runner-up that z1/z2 end up ANCHOR-connecting to
! instead of joining, same role group 2/3 play in the other cl-test
! topologies.
frr version 10.0
hostname node-bb-r2
log file logs/bgpd-r2.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65121
  bgp router-id 10.0.0.121
  no bgp ebgp-requires-policy
  no bgp network import-check

  address-family link-state link-state
    distribute bgp-fabric-link-state
  exit-address-family

  midr transport-address 10.99.0.121
  midr group-id 2
  midr role group-rep
  midr bootstrap 10.99.0.101 remote-as 65101 router-id 10.0.0.101
  midr bootstrap 10.99.0.102 remote-as 65102 router-id 10.0.0.102
  midr bootstrap 10.99.0.103 remote-as 65103 router-id 10.0.0.103
  midr bootstrap 10.99.0.104 remote-as 65104 router-id 10.0.0.104
  midr bootstrap 10.99.0.105 remote-as 65105 router-id 10.0.0.105
!
