! Node r2: rep. Transport(lo) 10.99.0.121 | Router-ID 10.0.0.121 | ASN 65121
frr version 10.0
hostname node-bb-r2
log file logs/bgpd-r2.log debugging
log timestamp precision 3

debug bgp midr

! eth1 -> t2
interface eth1
 ip address 10.10.24.1/30
!
interface lo
 ip address 10.99.0.121/32
!
route-map UNDERLAY-PERMIT permit 10
!
router bgp 65121
  bgp router-id 10.0.0.121
  no bgp network import-check

  midr transport-address 10.99.0.121
  midr group-id 2
  midr role group-rep
  midr bootstrap 10.99.0.101 remote-as 65101 router-id 10.0.0.101
  midr bootstrap 10.99.0.102 remote-as 65102 router-id 10.0.0.102
  midr bootstrap 10.99.0.103 remote-as 65103 router-id 10.0.0.103
  midr bootstrap 10.99.0.104 remote-as 65104 router-id 10.0.0.104
  midr bootstrap 10.99.0.105 remote-as 65105 router-id 10.0.0.105

  neighbor 10.10.24.2 remote-as 65202
  !
  address-family ipv4 unicast
    redistribute connected
    neighbor 10.10.24.2 route-map UNDERLAY-PERMIT in
    neighbor 10.10.24.2 route-map UNDERLAY-PERMIT out
  exit-address-family
!
