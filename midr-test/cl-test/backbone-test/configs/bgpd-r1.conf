! Node r1: rep. Transport(lo) 10.99.0.111 | Router-ID 10.0.0.111 | ASN 65111
frr version 10.0
hostname node-bb-r1
log file logs/bgpd-r1.log debugging
log timestamp precision 3

debug bgp midr

! eth1 -> t1
interface eth1
 ip address 10.10.21.1/30
!
interface lo
 ip address 10.99.0.111/32
!
route-map UNDERLAY-PERMIT permit 10
!
router bgp 65111
  bgp router-id 10.0.0.111
  no bgp network import-check

  midr transport-address 10.99.0.111
  midr group-id 1
  midr role group-rep
  midr bootstrap 10.99.0.101 remote-as 65101 router-id 10.0.0.101
  midr bootstrap 10.99.0.102 remote-as 65102 router-id 10.0.0.102
  midr bootstrap 10.99.0.103 remote-as 65103 router-id 10.0.0.103
  midr bootstrap 10.99.0.104 remote-as 65104 router-id 10.0.0.104
  midr bootstrap 10.99.0.105 remote-as 65105 router-id 10.0.0.105

  neighbor 10.10.21.2 remote-as 65201
  !
  address-family ipv4 unicast
    redistribute connected
    neighbor 10.10.21.2 route-map UNDERLAY-PERMIT in
    neighbor 10.10.21.2 route-map UNDERLAY-PERMIT out
  exit-address-family
!
