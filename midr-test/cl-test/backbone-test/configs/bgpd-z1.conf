! Node z1: zero-config join-flow test node (the "newnode" role, containerlab
! original's name kept for traceability with doc/change-3.md's
! backbone-discovery/backbone-shutdown scripts, which already reference
! Z1_TRANSPORT=10.99.0.191 / Z1_RID=10.0.0.191). No group-id, no role --
! only bootstrap candidates. Attached to t3.
! Transport(lo) 10.99.0.191 | Router-ID 10.0.0.191 | ASN 65191
frr version 10.0
hostname node-bb-z1
log file logs/bgpd-z1.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65191
  bgp router-id 10.0.0.191
  no bgp ebgp-requires-policy
  no bgp network import-check

  address-family link-state link-state
    distribute bgp-fabric-link-state
  exit-address-family

  midr transport-address 10.99.0.191
  midr group-id 0
  midr bootstrap 10.99.0.101 remote-as 65101 router-id 10.0.0.101
  midr bootstrap 10.99.0.102 remote-as 65102 router-id 10.0.0.102
  midr bootstrap 10.99.0.103 remote-as 65103 router-id 10.0.0.103
  midr bootstrap 10.99.0.104 remote-as 65104 router-id 10.0.0.104
  midr bootstrap 10.99.0.105 remote-as 65105 router-id 10.0.0.105
!
