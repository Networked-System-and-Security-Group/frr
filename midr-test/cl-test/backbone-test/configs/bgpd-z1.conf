! Node z1: zeroconf. Transport(lo) 10.99.0.191 | Router-ID 10.0.0.191 | ASN 65191
frr version 10.0
hostname node-bb-z1
log file logs/bgpd-z1.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

! eth1 -> t3
interface eth1
 ip address 10.10.31.1/30
!
interface lo
 ip address 10.99.0.191/32
!
route-map UNDERLAY-PERMIT permit 10
!
router bgp 65191
  bgp router-id 10.0.0.191
  no bgp network import-check

  midr transport-address 10.99.0.191
  ! zero-config join-flow test node: transport + bootstrap candidates only,
  ! no group-id (config_group_id 0 is now rejected outright), no role.
  midr bootstrap 10.99.0.101 remote-as 65101 router-id 10.0.0.101
  midr bootstrap 10.99.0.102 remote-as 65102 router-id 10.0.0.102
  midr bootstrap 10.99.0.103 remote-as 65103 router-id 10.0.0.103
  midr bootstrap 10.99.0.104 remote-as 65104 router-id 10.0.0.104
  midr bootstrap 10.99.0.105 remote-as 65105 router-id 10.0.0.105

  neighbor 10.10.31.2 remote-as 65203
  !
  address-family ipv4 unicast
    redistribute connected
    neighbor 10.10.31.2 route-map UNDERLAY-PERMIT in
    neighbor 10.10.31.2 route-map UNDERLAY-PERMIT out
  exit-address-family
!
