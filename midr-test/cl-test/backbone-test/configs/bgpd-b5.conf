! Node b5: bootstrap. Transport(lo) 10.99.0.105 | Router-ID 10.0.0.105 | ASN 65105
frr version 10.0
hostname node-bb-b5
log file logs/bgpd-b5.log debugging
log timestamp precision 3

debug bgp midr

! eth1 -> t3
interface eth1
 ip address 10.10.15.1/30
!
interface lo
 ip address 10.99.0.105/32
!
route-map UNDERLAY-PERMIT permit 10
!
router bgp 65105
  bgp router-id 10.0.0.105
  no bgp network import-check

  midr transport-address 10.99.0.105
  midr role bootstrap
  midr session 10.99.0.101 remote-as 65101
  midr session 10.99.0.102 remote-as 65102
  midr session 10.99.0.103 remote-as 65103
  midr session 10.99.0.104 remote-as 65104
  midr bootstrap 10.99.0.101 remote-as 65101 router-id 10.0.0.101
  midr bootstrap 10.99.0.102 remote-as 65102 router-id 10.0.0.102
  midr bootstrap 10.99.0.103 remote-as 65103 router-id 10.0.0.103
  midr bootstrap 10.99.0.104 remote-as 65104 router-id 10.0.0.104

  neighbor 10.10.15.2 remote-as 65203
  !
  address-family ipv4 unicast
    redistribute connected
    neighbor 10.10.15.2 route-map UNDERLAY-PERMIT in
    neighbor 10.10.15.2 route-map UNDERLAY-PERMIT out
  exit-address-family
!
