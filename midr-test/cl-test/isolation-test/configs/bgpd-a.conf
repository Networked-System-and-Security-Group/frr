! Node a: bootstrap only. Not a group-rep itself, not in its own rep
! directory -- purely answers REP_LIST_REQ with a directory of {d, e}.
! Stays up for the whole test so f still has a live bootstrap contact after
! d and e are killed.
! Transport 10.30.1.2 | ASN 65201 | Router-ID 10.0.201.1
frr version 10.0
hostname node-iso-a
log file logs/bgpd-a.log debugging
log timestamp precision 3

debug bgp midr

router bgp 65201
  bgp router-id 10.0.201.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  address-family link-state link-state
  exit-address-family

  midr transport-address 10.0.201.1
  midr group-id 0
  midr role bootstrap
  midr session 10.0.202.1 remote-as 65202
  midr session 10.0.203.1 remote-as 65203
  ! 【我方适配】原版在这里手配了 d/e 两条代表目录；`midr rep group` 命令已于
  ! 保底轮 2 批 1.5 删除（目录改纯推导）。现在 d/e 会主动挂靠上来，a 从它们的
  ! Node NLRI 学到 GROUP_REP 位，自行推导出目录——不需要也不能再手配。
!
