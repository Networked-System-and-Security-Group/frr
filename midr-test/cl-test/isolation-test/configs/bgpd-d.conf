! Node d: singleton group-12 rep. Lower delay than e, so REP_PROBE_DONE
! ranks it as f's primary (JOIN) target. Will be killed mid-test to help
! isolate f.
! Transport 10.30.2.2 | ASN 65202 | Router-ID 10.0.202.1
frr version 10.0
hostname node-iso-d
log file logs/bgpd-d.log debugging
log timestamp precision 3

debug bgp midr

router bgp 65202
  bgp router-id 10.0.202.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  address-family link-state link-state
  exit-address-family

  midr transport-address 10.30.2.2
  midr group-id 12
  midr role group-rep
  midr rep group 12 transport 10.30.2.2 remote-as 65202
!
