! Node f: the joining/isolated node. Bootstraps via a. Ends up JOINed to d
! (its only groupmate) and ANCHOR-connected to e -- exactly two established
! sessions, nothing else. Once d and e are both killed, f has zero
! established sessions even though a (its bootstrap contact) is still alive.
! Transport 10.30.4.2 | ASN 65204 | Router-ID 10.0.204.1
frr version 10.0
hostname node-iso-f
log file logs/bgpd-f.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65204
  bgp router-id 10.0.204.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  address-family link-state link-state
    distribute bgp-fabric-link-state
  exit-address-family

  midr transport-address 10.0.204.1
  midr group-id 0
  ! 【我方适配】`router-id` 一栏是 2026-08-13（批 5a）起的必选项。
  midr bootstrap 10.0.201.1 remote-as 65201 router-id 10.0.201.1
!
