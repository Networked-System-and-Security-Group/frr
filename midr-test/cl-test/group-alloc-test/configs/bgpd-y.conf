! Node y: zero-config joiner #2, started at the same instant as x (see x's
! header comment). Deliberately given a larger router-id than x -- the
! layer-2 collision tie-break (smaller router-id keeps the number) makes y
! the predictable loser in the "repair" scenario, which is what the checker
! asserts on.
! Transport(lo) 10.99.5.12 | Router-ID 10.0.5.12 | ASN 65312
!
! eth1 -> b2 (real underlay eBGP session, see bgpd-b1.conf's header comment).
frr version 10.0
hostname node-ga-y
log file logs/bgpd-y.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

interface eth1
 ip address 10.10.55.14/30
!
interface lo
 ip address 10.99.5.12/32
!
route-map UNDERLAY-PERMIT permit 10
!
router bgp 65312
  bgp router-id 10.0.5.12
  no bgp network import-check

  midr transport-address 10.99.5.12
  ! 零配置：不配群号、不配角色（`midr group-id 0` 现在会被拒——群号 0 保留给
  ! 「未入网」状态，不得显式配置）。
  midr bootstrap 10.99.5.1 remote-as 65301 router-id 10.0.5.1
  midr bootstrap 10.99.5.2 remote-as 65302 router-id 10.0.5.2
  midr bootstrap 10.99.5.3 remote-as 65303 router-id 10.0.5.3

  neighbor 10.10.55.13 remote-as 65302
  !
  address-family ipv4 unicast
    redistribute connected
    neighbor 10.10.55.13 route-map UNDERLAY-PERMIT in
    neighbor 10.10.55.13 route-map UNDERLAY-PERMIT out
  exit-address-family
!
