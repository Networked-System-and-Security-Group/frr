! Node b1: bootstrap. Transport(lo) 10.99.5.1 | Router-ID 10.0.5.1 | ASN 65301
! Deliberately the smallest router-id among the 3 bootstraps, so every node's
! midr_nds_pick_group_allocator() elects it as the group-id allocator.
! run_test.sh's "repair" scenario simply doesn't start this node.
!
! eth1 -> b2 (real underlay eBGP session, matching
! midr-test/backbone-lab/configs-backbone/*/frr.conf's pattern -- needed so
! group2's Link NLRI generation sees a proper interface-adjacent peer;
! kernel forwarding itself still runs on setup.sh's static routes, see its
! header comment).
frr version 10.0
hostname node-ga-b1
log file logs/bgpd-b1.log debugging
log timestamp precision 3

debug bgp midr

interface eth1
 ip address 10.10.55.2/30
!
interface lo
 ip address 10.99.5.1/32
!
route-map UNDERLAY-PERMIT permit 10
!
router bgp 65301
  bgp router-id 10.0.5.1
  no bgp network import-check

  midr transport-address 10.99.5.1
  midr role bootstrap
  midr session 10.99.5.2 remote-as 65302
  midr session 10.99.5.3 remote-as 65303
  midr bootstrap 10.99.5.2 remote-as 65302 router-id 10.0.5.2
  midr bootstrap 10.99.5.3 remote-as 65303 router-id 10.0.5.3

  neighbor 10.10.55.1 remote-as 65302
  !
  address-family ipv4 unicast
    redistribute connected
    neighbor 10.10.55.1 route-map UNDERLAY-PERMIT in
    neighbor 10.10.55.1 route-map UNDERLAY-PERMIT out
  exit-address-family
!
