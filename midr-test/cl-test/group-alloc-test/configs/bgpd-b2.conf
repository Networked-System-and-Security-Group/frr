! Node b2: bootstrap, and the topology's hub/relay (ip_forward on, see
! setup.sh, for actual kernel packet forwarding -- underlay eBGP below is a
! separate mechanism, see setup.sh's routing section header comment).
! Transport(lo) 10.99.5.2 | Router-ID 10.0.5.2 | ASN 65302
!
! eth1 -> b1, eth2 -> b3, eth3 -> x, eth4 -> y
frr version 10.0
hostname node-ga-b2
log file logs/bgpd-b2.log debugging
log timestamp precision 3

debug bgp midr

interface eth1
 ip address 10.10.55.1/30
!
interface eth2
 ip address 10.10.55.5/30
!
interface eth3
 ip address 10.10.55.9/30
!
interface eth4
 ip address 10.10.55.13/30
!
interface lo
 ip address 10.99.5.2/32
!
route-map UNDERLAY-PERMIT permit 10
!
router bgp 65302
  bgp router-id 10.0.5.2
  no bgp network import-check

  midr transport-address 10.99.5.2
  midr role bootstrap
  midr session 10.99.5.1 remote-as 65301
  midr session 10.99.5.3 remote-as 65303
  midr bootstrap 10.99.5.1 remote-as 65301 router-id 10.0.5.1
  midr bootstrap 10.99.5.3 remote-as 65303 router-id 10.0.5.3

  neighbor 10.10.55.2 remote-as 65301
  neighbor 10.10.55.6 remote-as 65303
  neighbor 10.10.55.10 remote-as 65311
  neighbor 10.10.55.14 remote-as 65312
  !
  address-family ipv4 unicast
    redistribute connected
    neighbor 10.10.55.2 route-map UNDERLAY-PERMIT in
    neighbor 10.10.55.2 route-map UNDERLAY-PERMIT out
    neighbor 10.10.55.6 route-map UNDERLAY-PERMIT in
    neighbor 10.10.55.6 route-map UNDERLAY-PERMIT out
    neighbor 10.10.55.10 route-map UNDERLAY-PERMIT in
    neighbor 10.10.55.10 route-map UNDERLAY-PERMIT out
    neighbor 10.10.55.14 route-map UNDERLAY-PERMIT in
    neighbor 10.10.55.14 route-map UNDERLAY-PERMIT out
  exit-address-family
!
