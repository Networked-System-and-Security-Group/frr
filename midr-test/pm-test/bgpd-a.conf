! Node A — MIDR PM test
frr version 10.0
hostname node-a
log file bgpd-a.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65001
  bgp router-id 10.0.0.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  ! BGP-LS peering with Node B (Rattan veth addresses)
  neighbor 10.2.1.1 remote-as 65002
  neighbor 10.2.1.1 ebgp-multihop 5
  neighbor 10.2.1.1 update-source 10.1.1.1

  address-family link-state link-state
    distribute bgp-fabric-link-state
    neighbor 10.2.1.1 activate
  exit-address-family

  ! transport 必须与上面的静态邻居地址分开：同址会让 MIDR overlay 撞⑦归属守卫
  ! （"transport 地址上有一条运维会话，MIDR 不整形运维配置"）而建不起来。
  ! 用 loopback（= router-id），由 start-node-a.sh 配在 lo 上。
  midr transport-address 10.0.0.1
  midr group-id 1
  midr role group-rep
  ! ⚠ overlay 会话（`midr session 10.0.0.2 remote-as 65002`）**不写在这里**，由
  ! start-node-a.sh 在"远端视图回调已注册"之后敲。写进 conf 会在回调注册前就把
  ! 会话建起来，对端身份到达时无人接收、被丢弃且不重放（裸 bgpd 不触发
  ! bgp_config_end，注册靠 periodic_sync 30s 兜底）。
!
