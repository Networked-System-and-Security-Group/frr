! Node A — MIDR PM test
frr version 10.0
hostname node-a
log file bgpd-a.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65001
  bgp router-id 10.0.0.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  ! BGP-LS peering with Node B (Rattan veth addresses)
  neighbor 10.2.1.1 remote-as 65002
  neighbor 10.2.1.1 ebgp-multihop 5
  neighbor 10.2.1.1 update-source 10.1.1.1

  address-family link-state link-state
    distribute bgp-fabric-link-state
    neighbor 10.2.1.1 activate
  exit-address-family

  ! MIDR: use Rattan veth IP as transport address (no separate loopback needed)
  midr transport-address 10.1.1.1
  midr group-id 1
  midr role group-rep
!
