! Node B — MIDR PM test
frr version 10.0
hostname node-b
log file bgpd-b.log debugging
log timestamp precision 3

debug bgp midr
debug bgp link-state

router bgp 65002
  bgp router-id 10.0.0.2
  no bgp ebgp-requires-policy
  no bgp network import-check

  ! BGP-LS peering with Node A (Rattan veth addresses)
  neighbor 10.1.1.1 remote-as 65001
  neighbor 10.1.1.1 ebgp-multihop 5
  neighbor 10.1.1.1 update-source 10.2.1.1

  address-family link-state link-state
    distribute bgp-fabric-link-state
    neighbor 10.1.1.1 activate
  exit-address-family

  ! transport 与静态邻居地址分开，理由同 bgpd-a.conf
  midr transport-address 10.0.0.2
  midr group-id 1
  ! overlay 会话由 start-node-b.sh 在回调注册后敲，理由同 bgpd-a.conf
!
