name: midr-backbone

# 13 节点真分离台子（保底轮 2 批 4）+ z1/z2 零配置实验节点（不属常驻拓扑）。
# MIDR 节点之间零直连：所有 MIDR 会话强制多跳 overlay，8212 的触发环境。

topology:
  nodes:
    b1:
      kind: linux
      image: frr-ubuntu20:latest
      binds:
        - configs-backbone/b1/frr.conf:/etc/frr/frr.conf
        - configs-backbone/b1/daemons:/etc/frr/daemons
        - logs-backbone/b1:/etc/frr/logs
      exec:
        - mkdir -p /var/lib/frr
        - chown frr:frr /var/lib/frr
        - chown frr:frr /etc/frr/frr.conf
        - chmod 640 /etc/frr/frr.conf
        - chmod 777 /etc/frr
        - chown -R frr:frr /etc/frr/logs
        - /usr/lib/frr/frrinit.sh start

    b2:
