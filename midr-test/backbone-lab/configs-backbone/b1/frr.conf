frr version 10.7.0-dev
frr defaults traditional
hostname b1
log file /etc/frr/logs/frr.log
!
! eth1 -> t1
interface eth1
 ip address 10.10.11.1/30
!
interface lo
 ip address 10.99.0.101/32
!
! RFC 8212：本台子**不**用 `no bgp ebgp-requires-policy`（那开关是整实例的，
! 写了连动态 overlay 会话一起放行，8212 就永不触发）。underlay 邻居按真实网络
! 的做法显式挂 permit 策略；overlay 自动会话有意不预放行——它正是 8212 要考的。
route-map UNDERLAY-PERMIT permit 10
!
router bgp 65101
 bgp router-id 10.0.0.101
 midr transport-address 10.99.0.101
 neighbor 10.10.11.2 remote-as 65201
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 10.10.11.2 route-map UNDERLAY-PERMIT in
  neighbor 10.10.11.2 route-map UNDERLAY-PERMIT out
 exit-address-family
 !
 ! 〔件②（轮 4）删去 address-family link-state link-state 块（原含 distribute
 !   bgp-fabric-link-state）：MIDR 拓扑改由第二组的 (4,9) midr-ls 承载，其激活
 !   在代码里做（bgp_midr_ctrl.c 的整形 helper），不需要 conf 配置。不是漏配。〕
 !
 midr role bootstrap
 ! 引导专职：不配 midr group-id（群号恒 0）。骨干两两手工互指 + 名单互配，
 ! 两者缺一不可：session 管"连上"，bootstrap 管"认识"（子稿 §2①）。
 midr session 10.99.0.102 remote-as 65102
 midr session 10.99.0.103 remote-as 65103
 midr session 10.99.0.104 remote-as 65104
 midr session 10.99.0.105 remote-as 65105
 midr bootstrap 10.99.0.102 remote-as 65102 router-id 10.0.0.102
 midr bootstrap 10.99.0.103 remote-as 65103 router-id 10.0.0.103
 midr bootstrap 10.99.0.104 remote-as 65104 router-id 10.0.0.104
 midr bootstrap 10.99.0.105 remote-as 65105 router-id 10.0.0.105
!
