frr version 10.7.0-dev
frr defaults traditional
hostname z1
log file /etc/frr/logs/frr.log
!
! Tier1 准入场景：z1 的 IP2ASN 快照把 t1 映射为虚构的 AS 64500，Tier1 名单只含
! 64500。经 t1 可达的 r1/m1a 性能最好，但 z1 必须拒绝与它们建 MIDR 会话。
debug bgp midr discovery
midr ip2asn file /etc/frr/midr-policy/prefix2as.txt
midr tier1 file /etc/frr/midr-policy/tier1_asns.txt
!
! eth1 -> t3
interface eth1
 ip address 10.10.31.1/30
!
interface lo
 ip address 10.99.0.191/32
 ip address 198.18.0.191/32
!
! RFC 8212：本台子**不**用 `no bgp ebgp-requires-policy`（那开关是整实例的，
! 写了连动态 overlay 会话一起放行，8212 就永不触发）。underlay 邻居按真实网络
! 的做法显式挂 permit 策略；overlay 自动会话有意不预放行——它正是 8212 要考的。
ip prefix-list UNDERLAY-LOOPBACKS seq 5 permit 10.99.0.0/24 ge 32 le 32
ip prefix-list MIDR-SERVICE seq 5 permit 198.18.0.191/32
route-map UNDERLAY-PERMIT permit 10
 match ip address prefix-list UNDERLAY-LOOPBACKS
route-map MIDR-PREFIX permit 10
 match ip address prefix-list MIDR-SERVICE
!
router bgp 65191
 bgp router-id 10.0.0.191
 midr transport-address 10.99.0.191
 midr avoid-tier1
 neighbor 10.10.31.2 remote-as 65203
 !
 address-family ipv4 unicast
  redistribute connected
  midr prefix-export route-map MIDR-PREFIX
  neighbor 10.10.31.2 route-map UNDERLAY-PERMIT in
  neighbor 10.10.31.2 route-map UNDERLAY-PERMIT out
 exit-address-family
 !
 ! 〔件②（轮 4）删去 address-family link-state link-state 块（原含 distribute
 !   bgp-fabric-link-state）：MIDR 拓扑改由第二组的 (4,9) midr-ls 承载，其激活
 !   在代码里做（bgp_midr_ctrl.c 的整形 helper），不需要 conf 配置。不是漏配。〕
 !
 ! 零配置实验节点（批 4 旧败④ / 批 5 场景 B）：只配 transport + 引导候选，
 ! **不配群号**、不配角色。不属常驻拓扑。
 midr bootstrap 10.99.0.101 remote-as 65101 router-id 10.0.0.101
 midr bootstrap 10.99.0.102 remote-as 65102 router-id 10.0.0.102
 midr bootstrap 10.99.0.103 remote-as 65103 router-id 10.0.0.103
 midr bootstrap 10.99.0.104 remote-as 65104 router-id 10.0.0.104
 midr bootstrap 10.99.0.105 remote-as 65105 router-id 10.0.0.105
!
